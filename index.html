<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F4ED">
<title>صرّة — التسجيل المبكر</title>
<meta name="description" content="اعرف كم تقدر تصرف اليوم. صرّة يحسب لك المبلغ المناسب للصرف من راتبك بعد التزاماتك.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f4ed;--brand:#0f5a59;--gold:#d89b00;--muted:#817b73;--border:#e5ddd1;--surface:#fffdfa}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}body{background:var(--bg);font-family:Cairo,system-ui,sans-serif;color:#171717;min-height:100svh;-webkit-font-smoothing:antialiased}.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 0 max(28px,env(safe-area-inset-bottom))}.preview{display:block;width:100%;height:auto}.form-card{margin:-1px 18px 0;background:rgba(255,253,250,.98);border:1px solid var(--border);border-radius:0 0 30px 30px;padding:18px 18px 16px;box-shadow:0 18px 42px rgba(31,72,68,.07)}.input-wrap{position:relative}.mail{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:25px;height:19px;border:2px solid #8c877f;border-radius:4px}.mail:after{content:"";position:absolute;left:3px;right:3px;top:2px;height:9px;border-bottom:2px solid #8c877f;transform:skewY(-30deg) rotate(0deg);opacity:.9}input{width:100%;height:62px;border:1.5px solid #d7d1c9;border-radius:19px;background:#fff;color:#222;font:500 17px Cairo,sans-serif;text-align:right;padding:0 18px 0 56px;outline:none}input::placeholder{color:#a29d96}input:focus{border-color:rgba(15,90,89,.48);box-shadow:0 0 0 4px rgba(15,90,89,.08)}button{width:100%;height:61px;margin-top:11px;border:0;border-radius:18px;background:linear-gradient(180deg,#e1a400,#cd9000);color:#fff;font:800 20px Cairo,sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(205,144,0,.18)}button:active{transform:translateY(1px)}.note{text-align:center;margin-top:13px;color:var(--muted);font-size:14px;font-weight:600}.success{display:none;text-align:center;margin-top:12px;padding:12px 14px;border-radius:15px;background:#eaf3f0;color:var(--brand);font-size:14px;font-weight:800}.footer{text-align:center;color:var(--brand);opacity:.7;font-size:12px;font-weight:800;padding:18px 18px 0}@media(max-width:380px){.form-card{margin-left:13px;margin-right:13px;padding-left:14px;padding-right:14px}input{height:58px;font-size:16px}button{height:58px;font-size:18px}}
</style>
</head>
<body>
<main class="wrap">
  <img class="preview" src="hero.webp" alt="صرّة — اعرف كم تقدر تصرف اليوم، مع مثال للآمن للصرف والتزاماتك القادمة">
  <section class="form-card" id="register">
    <form action="https://formsubmit.co/meshalalayadi@gmail.com" method="POST">
      <div class="input-wrap">
        <span class="mail" aria-hidden="true"></span>
        <input type="email" name="email" placeholder="بريدك الإلكتروني" autocomplete="email" inputmode="email" required>
      </div>
      <input type="hidden" name="_subject" value="صرّة — تسجيل مبكر جديد">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" id="next" name="_next">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit">سجّلني للدخول المبكر</button>
    </form>
    <div class="success" id="success">تم تسجيلك للدخول المبكر ✓</div>
    <div class="note">🔒 بدون رسوم الآن</div>
  </section>
  <div class="footer">صرّة — رتّب فلوسك ببساطة</div>
</main>
<script>
const next=document.getElementById('next');if(next)next.value=location.origin+location.pathname+'?registered=1#register';
if(new URLSearchParams(location.search).get('registered')==='1'){document.getElementById('success').style.display='block';history.replaceState({},'',location.pathname+'#register')}
</script>
</body>
</html>
