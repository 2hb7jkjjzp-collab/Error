<style>

11;font:800 15px "Cairo",sans-serif;cursor:pointer}.tiny{margin:8px auto 0;color:var(--muted);font-size:10.5px;line-height:1.6}.success{display:none;margin:13px auto 0;padding:12px;border-radius:15px;background:#EAF1F0;color:var(--brand);font-size:13px;font-weight:800}.footer{margin-top:15px;color:var(--brand);font-size:11px;font-weight:700;opacity:.68}@media(max-width:360px){.page{padding-left:13px;padding-right:13px}h1{font-size:28px}.preview{max-height:420px}}

  <p class="lead">صرّة يحسبها من راتبك بعد التزاماتك — قبل ما تصرف، مو بعده.</p>

  <form class="register" action="https://formsubmit.co/meshalalayadi@gmail.com" method="POST">
    <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="بريدك الإلكتروني" required />
    <input type="hidden" name="_subject" value="صرّة — تسجيل مبكر جديد" />
    <input type="hidden" name="_template" value="table" />
    <input type="hidden" name="_captcha" value="false" />
    <input type="hidden" id="next" name="_next" />
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
    <button type="submit">سجّلني للدخول المبكر</button>
  </form>
  <p class="tiny">بدون رسوم أو اشتراك الآن. نبلغك وقت الإطلاق فقط.</p>
  <div class="success" id="success">تم ✓ سجلناك للدخول المبكر.</div>
