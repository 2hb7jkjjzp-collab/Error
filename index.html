<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF7F1"><title>صرّة — التسجيل المبكر</title><meta name="description" content="صرّة يحسب لك كم آمن تصرفه اليوم بعد راتبك والتزاماتك. سجّل للدخول المبكر."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#FAF7F1;--brand:#174B4C;--gold:#D5A31A;--sun:#F4C84C;--text:#111;--sub:#66625D;--muted:#97928B;--border:#E7E3DC}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{min-height:100svh;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.page{width:100%;max-width:480px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));text-align:center}.logo{color:var(--brand);font-size:37px;font-weight:800;line-height:1;margin:2px 0 10px}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#EAF1F0;color:var(--brand);font-size:12px;font-weight:700}.badge i{width:7px;height:7px;border-radius:50%;background:var(--sun)}h1{margin:14px auto 0;max-width:430px;font-size:clamp(30px,8vw,41px);line-height:1.34;letter-spacing:-1.1px;font-weight:800}.accent{color:var(--brand);position:relative;white-space:nowrap}.accent:after{content:"";position:absolute;right:0;left:0;bottom:1px;height:7px;border-radius:999px;background:var(--sun);opacity:.58;z-index:-1}.lead{margin:10px auto 0;max-width:410px;color:var(--sub);font-size:14px;line-height:1.8}.preview-wrap{margin:18px auto 0;width:100%;border-radius:28px;overflow:hidden;border:1px solid var(--border);background:#fff;box-shadow:0 18px 45px rgba(23,75,76,.11)}.preview{display:block;width:100%;height:auto}.mini{margin:10px auto 0;color:var(--muted);font-size:11px;font-weight:600}.register{margin:16px auto 0;width:100%}.register input[type=email]{display:block;width:100%;height:54px;border:1px solid var(--border);border-radius:16px;background:#fff;color:var(--text);padding:0 16px;text-align:center;font:500 15px Cairo,sans-serif;outline:none}.register input[type=email]:focus{border-color:rgba(23,75,76,.45);box-shadow:0 0 0 4px rgba(23,75,76,.07)}.register button{display:block;width:100%;height:54px;margin-top:8px;border:0;border-radius:16px;background:var(--gold);color:#111;font:800 15px Cairo,sans-serif;cursor:pointer}.tiny{margin:8px auto 0;color:var(--muted);font-size:10.5px;line-height:1.6}.success{display:none;margin:13px auto 0;padding:12px;border-radius:15px;background:#EAF1F0;color:var(--brand);font-size:13px;font-weight:800}.footer{margin-top:15px;color:var(--brand);font-size:11px;font-weight:700;opacity:.68}@media(max-width:360px){.page{padding-left:13px;padding-right:13px}h1{font-size:28px}}</style></head><body><main class="page"><div class="logo">صرّة</div><div class="badge"><i></i>التسجيل المبكر</div><h1>اعرف وش <span class="accent">الآمن لك تصرفه اليوم</span></h1><p class="lead">صرّة يحسبها من راتبك بعد التزاماتك — قبل ما تصرف، مو بعده.</p><div class="preview-wrap"><img class="preview" src="sarrah_preview_hero.webp" alt="واجهة صرّة — الآمن للصرف اليوم"></div><div class="mini">راتبك − التزاماتك − اللي صرفته = رقم واضح لليوم</div><form class="register" action="https://formsubmit.co/meshalalayadi@gmail.com" method="POST"><input type="email" name="email" autocomplete="email" inputmode="email" placeholder="بريدك الإلكتروني" required><input type="hidden" name="_subject" value="صرّة — تسجيل مبكر جديد"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" id="next" name="_next"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off"><button type="submit">سجّلني للدخول المبكر</button></form><p class="tiny">بدون رسوم أو اشتراك الآن. نبلغك وقت الإطلاق فقط.</p><div class="success" id="success">تم ✓ سجلناك للدخول المبكر.</div><div class="footer">صرّة — رتّب فلوسك ببساطة</div></main><script>document.getElementById('next').value=location.origin+location.pathname+'?registered=1';if(new URLSearchParams(location.search).get('registered')==='1'){document.getElementById('success').style.display='block';history.replaceState({},'',location.pathname)}</script></body></html>
