    <p class="tiny">بدون رسوم أو اشتراك الآن. نبلغك وقت الإطلاق فقط.</p>
    <div class="success" id="success">تم ✓ سجلناك للدخول المبكر.</div>
    <div class="footer">صرّة — رتّب فلوسك ببساطة</div>
  </main>
  <script>
    (()=>{
      const d=new Date();
      const k=Number(`${d.getFullYear()}${d.getMonth()+1}${d.getDate()}`);
      const value=(235+((k*37)%118)+((k*11)%100)/100).toFixed(2);
      document.getElementById('amount').textContent=value;
      if(new URLSearchParams(location.search).get('registered')==='1'){
        document.getElementById('success').style.display='block';
        history.replaceState({},'',location.pathname);
      }
    })();
  </script>
